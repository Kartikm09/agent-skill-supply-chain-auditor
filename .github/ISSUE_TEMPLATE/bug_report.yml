name: Bug report
description: Report reproducible scanner or reporter behaviour using synthetic input.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not attach real credentials, private Agent Skills, client data, or live exploit targets.
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Include the smallest portfolio-safe bundle and exact command.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: The reproduction contains only synthetic, non-sensitive data.
          required: true
