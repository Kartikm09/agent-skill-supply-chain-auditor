name: Rule proposal
description: Propose a deterministic static signal with clear matching boundaries.
title: "rule: "
labels: [enhancement, rule-proposal]
body:
  - type: textarea
    id: reviewer_problem
    attributes:
      label: Reviewer problem
      description: What pre-execution decision does this evidence improve?
    validations:
      required: true
  - type: textarea
    id: positive
    attributes:
      label: Synthetic positive example
    validations:
      required: true
  - type: textarea
    id: negative
    attributes:
      label: Nearby negative example
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Proposed severity
      options: [low, medium, high, critical]
    validations:
      required: true
  - type: textarea
    id: limitations
    attributes:
      label: False-positive and false-negative boundaries
    validations:
      required: true
